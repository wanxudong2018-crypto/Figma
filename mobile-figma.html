<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓鼠快传</title>
    <link rel="manifest" href="/Figma/pwa-manifest.json">
    <meta name="theme-color" content="#ECEDF8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="仓鼠快传">
    <style>
        :root {
            --bg: linear-gradient(180deg, #5A85D0 0%, #EDF0FB 51%, #EDF0FB 100%);
            --card: rgba(255, 255, 255, 0.4);
            --purple: #5A85D0;
            --purple-light: #EAEAF8;
            --green: #52C41A;
            --text: #1A1A2E;
            --sub: #5A6B8A;
            --border: #A2B9E5;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
            background: var(--bg);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 16px 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            margin-top: 8px;
            font-weight: 500;
        }

        .card {
            background: var(--card);
            border-radius: 40px;
            padding: 16px;
            border: 11px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }

        .btn-outline {
            background: #F5F6F9;
            border: 1px solid #EBEDF0;
            color: var(--text);
        }

        .btn-primary {
            background: #F5F6F9;
            border: 1px solid #EBEDF0;
            color: var(--text);
        }

        .btn-primary.success {
            background: var(--green) !important;
            border-color: var(--green) !important;
            color: #FFFFFF !important;
        }

        .full-bleed-card {
            background: #FFFFFF;
            border-radius: 24px 24px 0 0;
            padding: 32px 24px 60px;
            margin: 0 -16px 0 -16px;
            width: calc(100% + 32px);
            flex: 1;
        }

        /* Upload Zone */
        .upload-zone {
            border: 1px dashed #FFFFFF;
            border-radius: 20px;
            padding: 0 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 180px;
        }

        .upload-zone.uploading {
            cursor: default;
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-icon-wrap svg {
            stroke: var(--purple);
        }

        .upload-default-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .upload-progress {
            display: none;
            width: 100%;
            max-width: 200px;
        }

        .upload-zone.uploading .upload-default-label {
            display: none;
        }

        .upload-zone.uploading .upload-progress {
            display: block;
        }

        .progress-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 12px;
            text-align: center;
        }

        .progress-bar-bg {
            background: var(--border);
            border-radius: 100px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--green);
            border-radius: 100px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-count {
            text-align: right;
            font-size: 13px;
            color: var(--sub);
        }

        /* iOS Setup Card */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .section-link {
            font-size: 13px;
            color: var(--purple);
            text-decoration: none;
        }

        .step-label {
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 10px;
        }

        .step-hint { font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: -8px; }

        .step-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid #EBEDF0;
            background: #F5F6F9;
            color: var(--text);
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .step-btn-dark {
            background: #1A1A2E !important;
            color: #FFFFFF !important;
            border: none;
        }

        .step-btn.success {
            background: var(--green) !important;
            border-color: var(--green) !important;
            color: #FFFFFF !important;
        }

        /* 模态框样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            width: 85%; max-width: 320px; text-align: center;
            border-radius: 20px; padding: 24px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(200, 200, 200, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            .modal-content { background: rgba(40, 40, 40, 0.95); border-color: rgba(255, 255, 255, 0.1); }
        }
        .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
        .modal-body { font-size: 14px; color: var(--text); opacity: 0.8; margin-bottom: 24px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 12px; }
        .modal-btn-cancel {
            flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 500;
            background: rgba(150, 150, 150, 0.15); color: var(--text); cursor: pointer;
        }
        .modal-btn-primary {
            flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 500;
            background: var(--purple); color: white; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 28px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #1A1A2E;
            font-size: 15px;
            font-weight: 600;
            display: none;
            z-index: 1000;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        #share-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 24px 16px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            z-index: 200;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div id="toast"></div>
    <div id="share-banner"></div>

    <!-- 模态框 (Modal) -->
    <div id="errorModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">提示</div>
            <div class="modal-body" id="errorModalMsg">上传失败</div>
            <div class="modal-actions">
                <button class="modal-btn-cancel" onclick="document.getElementById('errorModal').style.display='none'">关闭</button>
                <a class="modal-btn-primary" id="errorModalAction" href="https://afdian.net/a/wanonedesign" target="_blank" style="display: none;">购买会员</a>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="logo">
            <img src="logo.svg" alt="仓鼠快传" style="width: 200px; height: 64px; display: block; margin: 0 auto;">
        </div>
        <p>即刻将手机截图发送至 Figma</p>
    </div>

    <!-- 上传卡片 -->
    <div class="card">
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">
                <svg width="80" height="80" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6.66675 35.9999C6.66675 30.1089 11.4424 25.3333 17.3334 25.3333H46.6667H60.0001H101.667C107.558 25.3333 112.333 30.1089 112.333 35.9999V89.3333C112.333 95.2243 107.558 99.9999 101.667 99.9999H17.3334C11.4424 99.9999 6.66675 95.2243 6.66675 89.3332V35.9999Z" fill="#0099D1"/>
                    <path d="M17.3337 19.75H41.4705C44.5198 19.7501 47.3995 21.1534 49.2791 23.5547L58.2087 34.9629C59.1091 36.113 60.4884 36.7852 61.949 36.7852H102.667C108.144 36.7852 112.584 41.2253 112.584 46.7021V89.333C112.584 94.8098 108.144 99.25 102.667 99.25H17.3337C11.8569 99.25 7.41675 94.8098 7.41675 89.333V29.667C7.41675 24.1902 11.8569 19.75 17.3337 19.75Z" fill="url(#paint0_linear_850_904)" stroke="url(#paint1_linear_850_904)" stroke-width="1.5"/>

                    <path d="M41.5771 87.1921V79.7041H46.2171V81.1441H47.3371V79.7041H50.5532V81.1441H51.9771V87.1921H50.2331V81.4961H47.6571V87.1921H45.9131V81.4961H43.3371V87.1921H41.5771Z" fill="white"/>

                    <linearGradient id="paint0_linear_850_904" x1="55.3334" y1="15.3333" x2="60.0001" y2="100" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#45DDFF"/>

                    </linearGradient>
                    <linearGradient id="paint1_linear_850_904" x1="60.0001" y1="20" x2="60.0001" y2="100" gradientUnits="userSpaceOnUse">
                    <stop stop-color="white"/>
                    <stop offset="1" stop-color="#21C7FF"/>
                    </linearGradient>
                    <linearGradient id="paint2_linear_850_904" x1="97.6667" y1="56" x2="97.6667" y2="109.333" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#D5ECFF"/>
                    <stop offset="1" stop-color="white"/>
                    </linearGradient>
                    <linearGradient id="paint3_linear_850_904" x1="97.6667" y1="56" x2="97.6667" y2="109.333" gradientUnits="userSpaceOnUse">
                    <stop stop-color="white"/>
                    <stop offset="1" stop-color="white" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="paint4_linear_850_904" x1="98" y1="69" x2="98" y2="95" gradientUnits="userSpaceOnUse">

                </svg>
            </div>
            <div id="uploadLabel" class="upload-default-label">点击选择或拍摄截图</div>
            <div class="upload-progress">
                <div class="progress-label" id="progressLabel">正在上传 0/0</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        <input type="file" id="fileInput" multiple="multiple" accept="image/png, image/jpeg, image/jpg, image/webp" style="display:none">
    </div>

    <!-- iOS 设置卡片 -->
    <div class="full-bleed-card">
        <div class="section-header">
            <span class="section-title">iOS 端原生分享设置方案</span>
            <a href="#" class="section-link">视频引导</a>
        </div>

        <div class="step-label">1、下载 iOS 快捷指令</div>
        <a id="btnShortcut" href="https://www.icloud.com/shortcuts/84eec593c0644fc782897a80c66340a3" target="_blank"
            class="step-btn">
            <svg width="16" height="16" viewBox="0 0 814 1000" fill="currentColor">
                <path
                    d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.5-155.5-103.5c-43.7-58.3-99-155.4-99-252.5 0-184.7 120.2-282.2 238.4-282.2 63.1 0 115.5 41.6 155 41.6 37.8 0 97.5-44.4 168.7-44.4 27.3 0 109.9 4 167 75.4zm-234.7-90.5c31.6-37.9 54.3-90.5 54.3-143.1 0-7.3-.6-14.7-1.9-20.7-51.6 1.9-112.3 34.8-149.2 75.7-28.5 32.4-55.1 84.9-55.1 138.2 0 8.3 1.3 16.6 1.9 19.2 3.2.6 8.4 1.3 13.6 1.3 46.5 0 102.5-31.6 136.4-70.6z" />
            </svg>
            下载 iOS 快捷指令
        </a>

        <div class="step-label">2、配置快捷指令专属链接</div>
        <button id="copyBtn" class="step-btn step-btn-dark" onclick="copyUploadUrl()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            复制专属链接
        </button>
        <div class="step-hint" id="copyHint" style="display:none">
            复制专属链接 → 打开「发送到 figma」快捷指令 → 粘贴到顶部文字框中
        </div>
    </div>

    <script>
        // ─── Android Share Result ───────────────────────────────────────
        (function () {
            const p = new URLSearchParams(window.location.search);
            if (p.get('shared') !== '1') return;
            const b = document.getElementById('share-banner');
            const count = p.get('count'), total = p.get('total'), err = p.get('error');
            if (count) {
                b.style.cssText = 'background:#e6f9f0;color:#0a7c42;display:block;';
                b.textContent = total && total !== count ? `✅ 已发送 ${count}/${total} 张到 Figma` : `✅ ${count} 张图片已发送到 Figma！`;
            } else if (err === 'no_creds') {
                b.style.cssText = 'background:#fff3e0;color:#e65100;display:block;';
                b.textContent = '⚠️ 请先扫码配置专属链接，再使用原生分享';
            } else {
                b.style.cssText = 'background:#fce8e8;color:#c62828;display:block;';
                b.textContent = '❌ 上传失败，请检查网络后重试';
            }
            setTimeout(() => { b.style.display = 'none'; }, 4000);
        })();

        // ─── URL Params ─────────────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const _api = params.get('api'), _sid = params.get('sid'), _t = params.get('t');

        let _uploadUrl = '';
        if (_api && _sid && _t) {
            _uploadUrl = `${_api}/api/upload?sid=${_sid}&t=${_t}`;
            const hint = document.getElementById('copyHint');
            if (hint) hint.style.display = 'block';
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(reg => {
                    const sw = reg.active || reg.waiting || reg.installing;
                    if (sw) sw.postMessage({ type: 'STORE_CREDENTIALS', sid: _sid, t: _t, api: _api });
                });
            }
        }

        // ─── Copy URL ───────────────────────────────────────────────────
        function copyUploadUrl() {
            if (!_uploadUrl) { showToast('⚠️ 请先通过插件扫码进入'); return; }
            const btn = document.getElementById('copyBtn');
            const ok = () => {
                btn.textContent = '✅ 已复制！';
                btn.style.color = '#0a7c42'; btn.style.borderColor = '#0a7c42';
                setTimeout(() => {
                    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> 复制专属链接`;
                    btn.style.color = ''; btn.style.borderColor = '';
                }, 2000);
            };
            if (navigator.clipboard) { navigator.clipboard.writeText(_uploadUrl).then(ok); }
            else {
                const el = document.createElement('textarea');
                el.value = _uploadUrl; document.body.appendChild(el);
                el.select(); document.execCommand('copy');
                document.body.removeChild(el); ok();
            }
        }

        // ─── Upload ─────────────────────────────────────────────────────
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');

        function showToast(msg, duration) {
            const toastEl = document.getElementById('toast');
            toastEl.textContent = msg; toastEl.style.display = 'block';
            setTimeout(() => { toastEl.style.display = 'none'; }, duration || 3000);
        }

        // iOS Safari: use addEventListener instead of .onchange for reliability
        fileInput.addEventListener('change', function(e) {
            handleUpload(e);
        });

        async function handleUpload(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;

            if (!_api || !_sid) {
                showToast('⚠️ 请重新扫码进入（缺少授权信息）', 4000);
                return;
            }

            const label = document.getElementById('progressLabel');
            const fill = document.getElementById('progressFill');
            
            uploadZone.classList.add('uploading');
            uploadZone.onclick = null; // 传输中禁止再次点击
            
            let successCount = 0;
            const total = files.length;

            const updateUI = (count, isDone = false) => {
                const text = isDone ? `快传完成 ${count}/${total}` : `正在上传 ${count}/${total}`;
                label.textContent = text;
                fill.style.width = `${(count / total) * 100}%`;
            };

            updateUI(0);

            for (let i = 0; i < total; i++) {
                try {
                    const base64 = await compressImage(files[i], 0.85);
                    const fileId = `img_${Date.now()}_${Math.random().toString(36).substr(2,6)}`;
                    const res = await fetch(`${_api}/api/upload?sid=${_sid}&t=${_t}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: base64, filename: files[i].name, id: fileId })
                    });
                    
                    const result = await res.json();
                    if (!result.ok) {
                        const err = new Error(result.error || '上传失败');
                        err.code = result.errorCode;
                        throw err;
                    }

                    successCount++;
                    updateUI(successCount);
                } catch (err) {
                    const msg = err.message || '上传失败';
                    const btn = document.getElementById('errorModalAction');
                    if (err.code === 'QUOTA_EXCEEDED') {
                        document.getElementById('errorModalMsg').textContent = '今日免费额度已用完，请在电脑端插件中激活专业版';
                        btn.style.display = 'inline-flex';
                    } else {
                        document.getElementById('errorModalMsg').textContent = `第 ${i + 1} 张图片上传失败: ${msg}`;
                        btn.style.display = 'none';
                    }
                    document.getElementById('errorModal').style.display = 'flex';
                    break; // 出错即刻跳出循环
                }
            }

            // 完成状态
            updateUI(successCount, true);
            
            // 3秒后恢复默认
            setTimeout(() => {
                uploadZone.classList.remove('uploading');
                uploadZone.onclick = () => fileInput.click();
                fileInput.value = '';
                
                // 延迟重置进度条，配合 CSS 动画
                setTimeout(() => {
                    updateUI(0);
                }, 300);
            }, 3000);
        }

        function compressImage(file, quality = 0.85) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    toBase64(file).then(resolve).catch(reject);
                    return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let w = img.naturalWidth || img.width;
                            let h = img.naturalHeight || img.height;
                            
                            // 限制最大边长为 2048 像素 (移动端屏幕与 Figma 走查黄金大小)
                            const maxBound = 2048;
                            if (w > maxBound || h > maxBound) {
                                if (w > h) {
                                    h = Math.round(h * maxBound / w);
                                    w = maxBound;
                                } else {
                                    w = Math.round(w * maxBound / h);
                                    h = maxBound;
                                }
                            }
                            
                            canvas.width = w;
                            canvas.height = h;
                            
                            const ctx = canvas.getContext('2d');
                            // 填充白色背景底色，防止透明 PNG 转 JPEG 后有难看黑底
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillRect(0, 0, w, h);
                            
                            ctx.drawImage(img, 0, 0, w, h);
                            
                            // 统一强行输出为 image/jpeg 以获得最出色的网络传输压缩率
                            const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(compressedDataUrl);
                        } catch (err) {
                            // 降级使用原始 base64
                            resolve(e.target.result);
                        }
                    };
                    img.onerror = () => {
                        resolve(e.target.result);
                    };
                };
                reader.onerror = error => reject(error);
            });
        }

        const toBase64 = f => new Promise((res, rej) => {
            const r = new FileReader();
            r.readAsDataURL(f); r.onload = () => res(r.result); r.onerror = rej;
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Figma/sw.js', { scope: '/Figma/' })
                .then(r => console.log('[PWA] SW ok', r.scope))
                .catch(e => console.error('[PWA] SW fail', e));
        }
    </script>
