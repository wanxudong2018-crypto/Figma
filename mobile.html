<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓鼠走查 - 移动传送站</title>
    <style>
        :root { --p: #6366f1; --bg: #0f172a; --c: #1e293b; --t: #f8fafc; }
        body { margin: 0; background: var(--bg); color: var(--t); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .card { background: var(--c); border-radius: 24px; padding: 30px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        .icon { font-size: 50px; margin-bottom: 10px; }
        h1 { font-size: 20px; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 16px; border-radius: 12px; font-weight: 600; text-decoration: none; margin-bottom: 12px; cursor: pointer; transition: 0.2s; border: none; font-size: 16px; text-align: center; box-sizing: border-box; }
        .btn-up { background: var(--p); color: white; }
        .btn-up:active { transform: scale(0.98); opacity: 0.9; }
        .btn-sc { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }
        #fileInput { display: none; }
        .status { margin-top: 20px; font-size: 12px; color: var(--p); display: none; font-weight: 500; }
        .config-info { font-size: 10px; color: rgba(255,255,255,0.1); margin-top: 40px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🐹</div>
        <h1>仓鼠走查</h1>
        <p id="info">已安全连接到 Figma 插件</p>
        
        <input type="file" id="fileInput" accept="image/*" multiple>
        <button class="btn btn-up" onclick="document.getElementById('fileInput').click()">📷 拍照或选图上传</button>
        <a id="scLink" href="#" class="btn btn-sc">📎 安装快捷指令 (推荐)</a>
        
        <div id="status" class="status">正在传输中...</div>
    </div>

    <div id="configDebug" class="config-info"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sid = params.get('sid');
        const t = params.get('t');
        const apiUrl = params.get('api');

        if (!sid || !t || !apiUrl) {
            document.getElementById('info').innerHTML = '<span style="color:#ef4444">配置丢失，请重新从 Figma 扫码</span>';
            document.querySelector('.btn-up').style.display = 'none';
        }

        // 动态配置快捷指令链接 (如果需要)
        const SHORTCUT_BASE = "https://www.icloud.com/shortcuts/YOUR_ID"; 
        document.getElementById('scLink').href = SHORTCUT_BASE;

        document.getElementById('fileInput').onchange = async (e) => {
            const files = e.target.files;
            if (!files.length) return;
            
            const status = document.getElementById('status');
            status.style.display = 'block';
            
            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                status.textContent = `正在上传 (${i+1}/${files.length}) ${file.name}...`;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const base64 = event.target.result;
                    try {
                        const res = await fetch(`${apiUrl}/api/upload`, {
                            method: 'POST',
                            mode: 'cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ sid, t, image: base64, filename: file.name })
                        });
                        const data = await res.json();
                        if (data.ok) {
                            if (i === files.length - 1) {
                                status.textContent = '✅ 全部上传成功！';
                                setTimeout(() => { status.style.display = 'none'; }, 3000);
                            }
                        } else {
                            alert('上传失败: ' + data.error);
                        }
                    } catch (err) {
                        alert('网络错误: 请确保阿里云函数已开启跨域(CORS)');
                    }
                };
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
