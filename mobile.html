<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仓鼠快传 - 移动端</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --primary-color: #18A0FB;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #eeeeee;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 20px; margin: 0 0 8px 0; color: var(--text-main); }
        .header p { font-size: 14px; color: var(--text-sub); margin: 0; }
        
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 40px 20px;
            margin-bottom: 24px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .upload-area:active { background: #f0f7ff; border-color: var(--primary-color); }
        .upload-icon { font-size: 40px; margin-bottom: 12px; display: block; }
        
        .btn-send {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            display: none; /* 选图后显示 */
        }
        .btn-send:disabled { opacity: 0.6; }

        .preview-container {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .preview-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        #status-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            font-size: 14px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="status-toast"></div>
    <div class="container">
        <div class="header">
            <h1>🐹 仓鼠快传</h1>
            <p>即刻将手机截图发送至 Figma</p>
        </div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">📸</span>
            <span style="color:var(--primary-color); font-weight:500;">点击选择或拍摄截图</span>
        </div>
        
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
        
        <div id="preview" class="preview-container"></div>
        <button id="btnSend" class="btn-send">确认发送到 Figma</button>

        <div style="margin-top: 32px; font-size: 12px; color: #ccc;">
            Figma Mobile Bridge v1.0
        </div>
    </div>

    <a id="btnShortcut" href="https://www.icloud.com/shortcuts/84eec593c0644fc782897a80c66340a3" target="_blank" style="
        display: block;
        width: 100%;
        max-width: 400px;
        margin-top: 16px;
        padding: 14px;
        border-radius: 12px;
        border: 1.5px solid #FF8C00;
        background: transparent;
        color: #FF8C00;
        font-size: 16px;
        font-weight: 500;
        text-align: center;
        text-decoration: none;
        box-sizing: border-box;
    ">📥 下载 iOS 快捷指令</a>

    <!-- 快捷指令专属链接（扫码后显示） -->
    <div id="shortcutConfigCard" style="
        display: none;
        width: 100%;
        max-width: 400px;
        margin-top: 12px;
        background: #fff8f0;
        border: 1.5px solid #FF8C00;
        border-radius: 12px;
        padding: 16px;
        box-sizing: border-box;
    ">
        <div style="font-size: 14px; font-weight: 600; color: #FF8C00; margin-bottom: 6px;">⚙️ 配置快捷指令专属链接</div>
        <div style="font-size: 12px; color: #888; margin-bottom: 10px; line-height: 1.6;">
            复制下方链接 → 打开「发送到 figma」快捷指令 → 粘贴到顶部文字框中
        </div>
        <div id="uploadUrlBox" style="
            background: #f5f5f5;
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            color: #333;
            word-break: break-all;
            margin-bottom: 10px;
            font-family: monospace;
            line-height: 1.5;
        ">正在生成...</div>
        <button onclick="copyUploadUrl()" id="copyBtn" style="
            width: 100%;
            padding: 12px;
            background: #FF8C00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
        ">📋 复制专属链接</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const api = params.get('api');
        const sid = params.get('sid');
        const t = params.get('t');

        // 如果是扫码进来（有 sid/t），显示快捷指令配置卡片
        let _uploadUrl = '';
        if (api && sid && t) {
            _uploadUrl = `${api}/api/upload?sid=${sid}&t=${t}`;
            document.getElementById('shortcutConfigCard').style.display = 'block';
            document.getElementById('uploadUrlBox').textContent = _uploadUrl;
        }

        function copyUploadUrl() {
            if (!_uploadUrl) return;
            const btn = document.getElementById('copyBtn');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(_uploadUrl).then(() => {
                    btn.textContent = '✅ 已复制！';
                    setTimeout(() => { btn.textContent = '📋 复制专属链接'; }, 2000);
                });
            } else {
                const el = document.createElement('textarea');
                el.value = _uploadUrl;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                btn.textContent = '✅ 已复制！';
                setTimeout(() => { btn.textContent = '📋 复制专属链接'; }, 2000);
            }
        }

        const fileInput = document.getElementById('fileInput');
        const btnSend = document.getElementById('btnSend');
        const preview = document.getElementById('preview');
        const toast = document.getElementById('status-toast');

        let selectedFiles = [];

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        fileInput.onchange = (e) => {
            selectedFiles = Array.from(e.target.files);
            if (selectedFiles.length > 0) {
                btnSend.style.display = 'block';
                preview.innerHTML = '';
                selectedFiles.forEach(file => {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.className = 'preview-img';
                    preview.appendChild(img);
                });
            }
        };

        btnSend.onclick = async () => {
            if (!api || !sid) {
                alert('⚠️ 链接缺少关键参数，请重新扫码');
                return;
            }

            btnSend.disabled = true;
            btnSend.textContent = '正在传输...';
            
            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const base64 = await toBase64(file);
                    
                    const res = await fetch(`${api}/api/upload`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sid, t, image: base64, filename: file.name })
                    });
                    
                    const data = await res.json();
                    if (!data.ok) throw new Error(data.error);
                    
                    if (i === selectedFiles.length - 1) {
                        showToast('✅ 传输成功！');
                        setTimeout(() => {
                            btnSend.style.display = 'none';
                            preview.innerHTML = '';
                            fileInput.value = '';
                        }, 1000);
                    }
                }
            } catch (err) {
                console.error(err);
                const msg = err.message && err.message !== 'undefined'
                    ? `⚠️ ${err.message}`
                    : '⚠️ 会话已失效或网络错误\n请重新扫描电脑插件上的二维码';
                alert(msg);
            } finally {
                btnSend.disabled = false;
                btnSend.textContent = '确认发送到 Figma';
            }
        };

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
