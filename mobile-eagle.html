<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机截图</title>
    <meta name="theme-color" content="#ECEDF8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="手机截图">
    <style>
        :root {
            --bg: linear-gradient(180deg, #5A85D0 0%, #EDF0FB 51%, #EDF0FB 100%);
            --card: rgba(255, 255, 255, 0.4);
            --purple: #5A85D0;
            --purple-light: #EAEAF8;
            --green: #52C41A;
            --text: #1A1A2E;
            --sub: #5A6B8A;
            --border: #A2B9E5;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
            background: var(--bg);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 16px 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            margin-top: 8px;
            font-weight: 500;
        }

        .card {
            background: var(--card);
            border-radius: 40px;
            padding: 16px;
            border: 11px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }

        .full-bleed-card {
            background: #FFFFFF;
            border-radius: 24px 24px 0 0;
            padding: 32px 24px 60px;
            margin: 0 -16px 0 -16px;
            width: calc(100% + 32px);
            flex: 1;
        }

        /* Upload Zone */
        .upload-zone {
            border: 1px dashed #FFFFFF;
            border-radius: 20px;
            padding: 0 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 180px;
        }

        .upload-zone.uploading {
            cursor: default;
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-default-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .upload-progress {
            display: none;
            width: 100%;
            max-width: 200px;
        }

        .upload-zone.uploading .upload-default-label {
            display: none;
        }

        .upload-zone.uploading .upload-progress {
            display: block;
        }

        /* 原图选项样式 */
        .upload-original-container {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .original-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text);
            opacity: 0.85;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 10px;
            background: transparent;
            transition: all 0.2s;
            border: 1px solid transparent;
            font-weight: 500;
        }

        .original-label:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .original-label input {
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: var(--purple);
            margin: 0;
        }

        .upload-zone.uploading .upload-original-container {
            display: none;
        }

        .progress-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 12px;
            text-align: center;
        }

        .progress-bar-bg {
            background: var(--border);
            border-radius: 100px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--green);
            border-radius: 100px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .section-link {
            font-size: 13px;
            color: var(--purple);
            text-decoration: none;
        }

        .step-label {
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 10px;
        }

        .step-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid #EBEDF0;
            background: #F5F6F9;
            color: var(--text);
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .step-btn-dark {
            background: #1A1A2E !important;
            color: #FFFFFF !important;
            border: none;
        }

        /* 模态框样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            width: 85%; max-width: 320px; text-align: center;
            border-radius: 24px; padding: 24px;
            background: #FFFFFF;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
        }
        .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
        .modal-body { font-size: 14px; color: var(--text); opacity: 0.85; margin-bottom: 24px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 12px; }
        .modal-btn-cancel {
            flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 15px; font-weight: 500;
            background: rgba(0, 0, 0, 0.06); color: var(--text); cursor: pointer;
        }
        .modal-btn-primary {
            flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 15px; font-weight: 500;
            background: var(--text); color: white; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }

        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 28px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #1A1A2E;
            font-size: 15px;
            font-weight: 600;
            display: none;
            z-index: 1000;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
    </style>
</head>

    <div class="full-bleed-card">
        <div class="section-header">
            <span class="section-title">iOS 端原生分享设置方案</span>
            <a href="#" class="section-link">视频引导</a>
        </div>

        <div class="step-label">1、下载 iOS 快捷指令</div>
        <a id="btnShortcut" href="https://www.icloud.com/shortcuts/84eec593c0644fc782897a80c66340a3" target="_blank"
            class="step-btn">
            下载 iOS 快捷指令
        </a>

        <div class="step-label">2、配置快捷指令专属链接</div>
        <button id="copyBtn" class="step-btn step-btn-dark" onclick="copyUploadUrl()">
            复制专属链接
        </button>
        <div class="step-hint" id="copyHint" style="display:none">
            复制专属链接 → 打开「发送到 Eagle」快捷指令 → 粘贴到顶部文字框中
        </div>
    </div>

    <script>
        // --- 1. 参数与配置 ---
        const urlParams = new URLSearchParams(window.location.search);
        const config = {
            api: urlParams.get('api') || window.location.origin,
            sid: urlParams.get('sid') || '',
            t: urlParams.get('t') || ''
        };

        // --- 2. DOM 元素 ---
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const uploadLabel = document.getElementById('uploadLabel');
        const progressContainer = document.querySelector('.upload-progress');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        const copyHint = document.getElementById('copyHint');

        // --- 3. 初始化检查 ---
        if (!config.api || !config.sid || !config.t) {
            uploadLabel.textContent = '无效链接，请从插件扫码进入';
            uploadLabel.style.color = '#ff4d4f';
            uploadZone.style.opacity = '0.5';
            uploadZone.style.pointerEvents = 'none';
        } else {
            if (copyHint) copyHint.style.display = 'block';
            checkInitialQuota();
        }

        // --- 3.5 前置额度检查与拦截 ---
        let isQuotaExceeded = false;
        async function checkInitialQuota() {
            try {
                const response = await fetch(`${config.api}/api/check-quota?sid=${config.sid}&t=${config.t}`);
                const result = await response.json();
                if (result.ok && result.quotaExceeded) {
                    isQuotaExceeded = true;
                    uploadLabel.innerHTML = '今日免费额度已用完，<a href="https://www.ifdian.net/item/9e5ce82c4ea411f19fd852540025c377?utm_source=copylink&utm_medium=link" target="_blank" onclick="event.stopPropagation()" style="color: var(--purple); text-decoration: none; font-weight: 600;">请激活专业版</a>';
                    uploadLabel.style.color = 'var(--text)';
                }
            } catch(e) {}
        }

        uploadZone.addEventListener('click', (e) => {
            if (uploadZone.classList.contains('uploading')) return;
            
            if (isQuotaExceeded) {
                document.getElementById('errorModalMsg').textContent = '今日免费额度已用完，请在电脑端插件中激活专业版';
                document.getElementById('errorModalAction').style.display = 'inline-flex';
                document.getElementById('errorModal').style.display = 'flex';
                return;
            }
            
            fileInput.click();
        });

        // --- 4. 上传逻辑 ---
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            uploadZone.classList.add('uploading');
            progressContainer.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    progressLabel.textContent = `正在上传 ${i + 1}/${files.length}`;
                    const isOriginal = document.getElementById('originalCheckbox').checked;
                    let base64;
                    if (isOriginal) {
                        base64 = await fileToBase64(file);
                    } else {
                        base64 = await compressImage(file, 0.85);
                    }
                    const fileId = `img_${Date.now()}_${Math.random().toString(36).substr(2,6)}`;
                    
                    const response = await fetch(`${config.api}/api/upload`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sid: config.sid,
                            t: config.t,
                            image: base64,
                            id: fileId
                        })
                    });

                    const result = await response.json();
                    if (!result.ok) {
                        const err = new Error(result.error || '上传失败');
                        err.code = result.errorCode;
                        throw err;
                    }

                    const percent = Math.round(((i + 1) / files.length) * 100);
                    progressFill.style.width = `${percent}%`;

                } catch (err) {
                    const msg = err.message || '上传失败';
                    const btn = document.getElementById('errorModalAction');
                    if (err.code === 'QUOTA_EXCEEDED') {
                        document.getElementById('errorModalMsg').textContent = '今日免费额度已用完，请在电脑端插件中激活专业版';
                        btn.style.display = 'inline-flex';
                    } else {
                        document.getElementById('errorModalMsg').textContent = `第 ${i + 1} 张图片上传失败: ${msg}`;
                        btn.style.display = 'none';
                    }
                    document.getElementById('errorModal').style.display = 'flex';
                    break; // 出错即刻跳出循环，不再重复提示和请求
                }
            }

            progressLabel.textContent = '传输完成！';
            setTimeout(() => {
                uploadZone.classList.remove('uploading');
                progressContainer.style.display = 'none';
                progressFill.style.width = '0%';
                uploadLabel.textContent = '点击选择或拍摄截图';
                fileInput.value = '';
            }, 2000);
        });

        // --- 5. 工具函数 ---
        function compressImage(file, quality = 0.85) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    fileToBase64(file).then(resolve).catch(reject);
                    return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let w = img.naturalWidth || img.width;
                            let h = img.naturalHeight || img.height;
                            
                            // 限制最大边长为 2048 像素 (移动端阅读与 Eagle 收集的黄金尺寸)
                            const maxBound = 2048;
                            if (w > maxBound || h > maxBound) {
                                if (w > h) {
                                    h = Math.round(h * maxBound / w);
                                    w = maxBound;
                                } else {
                                    w = Math.round(w * maxBound / h);
                                    h = maxBound;
                                }
                            }
                            
                            canvas.width = w;
                            canvas.height = h;
                            
                            const ctx = canvas.getContext('2d');
                            // 填充白色背景底色，防止带透明度的 PNG 截图或素材转 JPEG 时产生黑色难看背景
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillRect(0, 0, w, h);
                            
                            ctx.drawImage(img, 0, 0, w, h);
                            
                            // 统一强行输出为 image/jpeg 以获得极其出色的压缩率 (特别针对 iOS/Android 巨大 PNG 截图)
                            const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(compressedDataUrl);
                        } catch (err) {
                            // 发生任何异常直接降级使用原始 Base64
                            resolve(e.target.result);
                        }
                    };
                    img.onerror = () => {
                        resolve(e.target.result);
                    };
                };
                reader.onerror = error => reject(error);
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function copyUploadUrl() {
            if (!config.sid) {
                showToast('⚠️ 请通过插件扫码进入');
                return;
            }
            const url = `${config.api}/api/upload?sid=${config.sid}&t=${config.t}`;
            navigator.clipboard.writeText(url).then(() => showToast('✅ 已复制快捷指令链接'));
        }
    </script>
</body>
</html>
