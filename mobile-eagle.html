<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机截图</title>
    <meta name="theme-color" content="#ECEDF8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="手机截图">
    <style>
        :root {
            --bg: linear-gradient(180deg, #5A85D0 0%, #EDF0FB 51%, #EDF0FB 100%);
            --card: rgba(255, 255, 255, 0.4);
            --purple: #5A85D0;
            --purple-light: #EAEAF8;
            --green: #52C41A;
            --text: #1A1A2E;
            --sub: #5A6B8A;
            --border: #A2B9E5;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
            background: var(--bg);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 16px 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            margin-top: 8px;
            font-weight: 500;
        }

        .card {
            background: var(--card);
            border-radius: 40px;
            padding: 16px;
            border: 11px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }

        .full-bleed-card {
            background: #FFFFFF;
            border-radius: 24px 24px 0 0;
            padding: 32px 24px 60px;
            margin: 0 -16px 0 -16px;
            width: calc(100% + 32px);
            flex: 1;
        }

        /* Upload Zone */
        .upload-zone {
            border: 1px dashed #FFFFFF;
            border-radius: 20px;
            padding: 0 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 180px;
        }

        .upload-zone.uploading {
            cursor: default;
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-default-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .upload-progress {
            display: none;
            width: 100%;
            max-width: 200px;
        }

        .upload-zone.uploading .upload-default-label {
            display: none;
        }

        .upload-zone.uploading .upload-progress {
            display: block;
        }

        /* 原图选项样式 */
        .upload-original-container {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .original-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text);
            opacity: 0.85;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 10px;
            background: transparent;
            transition: all 0.2s;
            border: 1px solid transparent;
            font-weight: 500;
        }

        .original-label:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        .original-label input {
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: var(--purple);
            margin: 0;
        }

        .upload-zone.uploading .upload-original-container {
            display: none;
        }

        .progress-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 12px;
            text-align: center;
        }

        .progress-bar-bg {
            background: var(--border);
            border-radius: 100px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--green);
            border-radius: 100px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .section-link {
            font-size: 13px;
            color: var(--purple);
            text-decoration: none;
        }

        .step-label {
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 10px;
        }

        .step-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid #EBEDF0;
            background: #F5F6F9;
            color: var(--text);
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .step-btn-dark {
            background: #1A1A2E !important;
            color: #FFFFFF !important;
            border: none;
        }

        /* 模态框样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            width: 85%; max-width: 320px; text-align: center;
            border-radius: 24px; padding: 24px;
            background: #FFFFFF;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
        }
        .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
        .modal-body { font-size: 14px; color: var(--text); opacity: 0.85; margin-bottom: 24px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 12px; }
        .modal-btn-cancel {
            flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 15px; font-weight: 500;
            background: rgba(0, 0, 0, 0.06); color: var(--text); cursor: pointer;
        }
        .modal-btn-primary {
            flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 15px; font-weight: 500;
            background: var(--text); color: white; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }

        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 28px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #1A1A2E;
            font-size: 15px;
            font-weight: 600;
            display: none;
            z-index: 1000;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>
    <div id="toast"></div>

    <!-- 模态框 (Modal) -->
    <div id="errorModal" class="modal-overlay">
        <div class="glass-card modal-content">
            <div class="modal-title">提示</div>
            <div class="modal-body" id="errorModalMsg">上传失败</div>
            <div class="modal-actions">
                <button class="modal-btn-cancel" onclick="document.getElementById('errorModal').style.display='none'">关闭</button>
                <a class="modal-btn-primary" id="errorModalAction" href="https://www.ifdian.net/item/9e5ce82c4ea411f19fd852540025c377?utm_source=copylink&utm_medium=link" target="_blank" style="display: none;">购买会员</a>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="logo">
            <img src="Eagle.png" alt="Eagle Logo" style="width: 170.5px; height: 54px; display: block; margin: 0 auto;">
        </div>
        <p>即刻将手机截图发送至 Eagle</p>
    </div>

    <!-- 上传卡片 -->
    <div class="card">
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">
                <svg width="80" height="80" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6.66675 35.9999C6.66675 30.1089 11.4424 25.3333 17.3334 25.3333H46.6667H60.0001H101.667C107.558 25.3333 112.333 30.1089 112.333 35.9999V89.3333C112.333 95.2243 107.558 99.9999 101.667 99.9999H17.3334C11.4424 99.9999 6.66675 95.2243 6.66675 89.3332V35.9999Z" fill="#0099D1"/>
                    <path d="M17.3337 19.75H41.4705C44.5198 19.7501 47.3995 21.1534 49.2791 23.5547L58.2087 34.9629C59.1091 36.113 60.4884 36.7852 61.949 36.7852H102.667C108.144 36.7852 112.584 41.2253 112.584 46.7021V89.333C112.584 94.8098 108.144 99.25 102.667 99.25H17.3337C11.8569 99.25 7.41675 94.8098 7.41675 89.333V29.667C7.41675 24.1902 11.8569 19.75 17.3337 19.75Z" fill="url(#paint0_linear_850_904)" stroke="url(#paint1_linear_850_904)" stroke-width="1.5"/>
                    <path d="M19.249 87.1921V76.8721H25.329V78.2961H26.785V80.0881H25.009V78.6801H21.009V81.1441H23.889V82.9201H21.009V87.1921H19.249Z" fill="white"/>
                    <path d="M28.7178 87.1921V79.7041H30.4778V87.1921H28.7178ZM28.7178 78.6801V76.8721H30.4778V78.6801H28.7178Z" fill="white"/>
                    <path d="M33.5484 90.0241V88.6161H32.1084V86.8241H33.8684V88.2321H37.8844V85.7681H33.5484V84.3441H32.1084V81.1441H33.5484V79.7041H38.2044V81.1441H39.6444V88.6161H38.2044V90.0241H33.5484ZM33.8684 83.9601H37.8844V81.4961H33.8684V83.9601Z" fill="white"/>
                    <path d="M41.5771 87.1921V79.7041H46.2171V81.1441H47.3371V79.7041H50.5532V81.1441H51.9771V87.1921H50.2331V81.4961H47.6571V87.1921H45.9131V81.4961H43.3371V87.1921H41.5771Z" fill="white"/>
                    <path d="M55.2046 87.1921V85.7681H53.7646V81.1441H55.2046V79.7041H59.8447V81.1441H61.3006V85.4001H62.7407V87.1921H60.9806V85.7681H59.8447V87.1921H55.2046ZM55.5246 85.4001H59.5247V81.4961H55.5246V85.4001Z" fill="white"/>
                    <circle cx="97.6667" cy="82.6667" r="25.6667" fill="url(#paint2_linear_850_904)" stroke="url(#paint3_linear_850_904)" stroke-width="2"/>
                    <path d="M111 82L98 69L85 82M98 69V95" stroke="url(#paint4_linear_850_904)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                    <linearGradient id="paint0_linear_850_904" x1="55.3334" y1="15.3333" x2="60.0001" y2="100" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#45DDFF"/>

                    </linearGradient>
                    <linearGradient id="paint1_linear_850_904" x1="60.0001" y1="20" x2="60.0001" y2="100" gradientUnits="userSpaceOnUse">
                    <stop stop-color="white"/>
                    <stop offset="1" stop-color="#21C7FF"/>
                    </linearGradient>
                    <linearGradient id="paint2_linear_850_904" x1="97.6667" y1="56" x2="97.6667" y2="109.333" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#D5ECFF"/>
                    <stop offset="1" stop-color="white"/>
                    </linearGradient>
                    <linearGradient id="paint3_linear_850_904" x1="97.6667" y1="56" x2="97.6667" y2="109.333" gradientUnits="userSpaceOnUse">
                    <stop stop-color="white"/>
                    <stop offset="1" stop-color="white" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="paint4_linear_850_904" x1="98" y1="69" x2="98" y2="95" gradientUnits="userSpaceOnUse">

                    </linearGradient>
                    </defs>
                </svg>
            </div>
            <div id="uploadLabel" class="upload-default-label">点击选择或拍摄截图</div>
            <div class="upload-original-container" onclick="event.stopPropagation()">
                <label class="original-label">
                    <input type="checkbox" id="originalCheckbox">
                    <span>上传原图</span>
                </label>
            </div>
            <div class="upload-progress">
                <div class="progress-label" id="progressLabel">正在上传 0/0</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        <input type="file" id="fileInput" multiple="multiple" accept="image/*" style="display:none">
    </div>

    <!-- iOS 设置卡片 -->
    <div class="full-bleed-card">
        <div class="section-header">
            <span class="section-title">iOS 端原生分享设置方案</span>
            <a href="#" class="section-link">视频引导</a>
        </div>

        <div class="step-label">1、下载 iOS 快捷指令</div>
        <a id="btnShortcut" href="https://www.icloud.com/shortcuts/84eec593c0644fc782897a80c66340a3" target="_blank"
            class="step-btn">
            下载 iOS 快捷指令
        </a>

        <div class="step-label">2、配置快捷指令专属链接</div>
        <button id="copyBtn" class="step-btn step-btn-dark" onclick="copyUploadUrl()">
            复制专属链接
        </button>
        <div class="step-hint" id="copyHint" style="display:none">
            复制专属链接 → 打开「发送到 Eagle」快捷指令 → 粘贴到顶部文字框中
        </div>
    </div>

    <script>
        // --- 1. 参数与配置 ---
        const urlParams = new URLSearchParams(window.location.search);
        const config = {
            api: urlParams.get('api') || window.location.origin,
            sid: urlParams.get('sid') || '',
            t: urlParams.get('t') || ''
        };

        // --- 2. DOM 元素 ---
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const uploadLabel = document.getElementById('uploadLabel');
        const progressContainer = document.querySelector('.upload-progress');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        const copyHint = document.getElementById('copyHint');

        // --- 3. 初始化检查 ---
        if (!config.api || !config.sid || !config.t) {
            uploadLabel.textContent = '无效链接，请从插件扫码进入';
            uploadLabel.style.color = '#ff4d4f';
            uploadZone.style.opacity = '0.5';
            uploadZone.style.pointerEvents = 'none';
        } else {
            if (copyHint) copyHint.style.display = 'block';
            checkInitialQuota();
        }

        // --- 3.5 前置额度检查与拦截 ---
        let isQuotaExceeded = false;
        async function checkInitialQuota() {
            try {
                const response = await fetch(`${config.api}/api/check-quota?sid=${config.sid}&t=${config.t}`);
                const result = await response.json();
                if (result.ok && result.quotaExceeded) {
                    isQuotaExceeded = true;
                    uploadLabel.innerHTML = '今日免费额度已用完，<a href="https://www.ifdian.net/item/9e5ce82c4ea411f19fd852540025c377?utm_source=copylink&utm_medium=link" target="_blank" onclick="event.stopPropagation()" style="color: var(--purple); text-decoration: none; font-weight: 600;">请激活专业版</a>';
                    uploadLabel.style.color = 'var(--text)';
                }
            } catch(e) {}
        }

        uploadZone.addEventListener('click', (e) => {
            if (uploadZone.classList.contains('uploading')) return;
            
            if (isQuotaExceeded) {
                document.getElementById('errorModalMsg').textContent = '今日免费额度已用完，请在电脑端插件中激活专业版';
                document.getElementById('errorModalAction').style.display = 'inline-flex';
                document.getElementById('errorModal').style.display = 'flex';
                return;
            }
            
            fileInput.click();
        });

        // --- 4. 上传逻辑 ---
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            uploadZone.classList.add('uploading');
            progressContainer.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    progressLabel.textContent = `正在上传 ${i + 1}/${files.length}`;
                    const isOriginal = document.getElementById('originalCheckbox').checked;
                    let base64;
                    if (isOriginal) {
                        base64 = await fileToBase64(file);
                    } else {
                        base64 = await compressImage(file, 0.85);
                    }
                    const fileId = `img_${Date.now()}_${Math.random().toString(36).substr(2,6)}`;
                    
                    const response = await fetch(`${config.api}/api/upload`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sid: config.sid,
                            t: config.t,
                            image: base64,
                            id: fileId
                        })
                    });

                    const result = await response.json();
                    if (!result.ok) {
                        const err = new Error(result.error || '上传失败');
                        err.code = result.errorCode;
                        throw err;
                    }

                    const percent = Math.round(((i + 1) / files.length) * 100);
                    progressFill.style.width = `${percent}%`;

                } catch (err) {
                    const msg = err.message || '上传失败';
                    const btn = document.getElementById('errorModalAction');
                    if (err.code === 'QUOTA_EXCEEDED') {
                        document.getElementById('errorModalMsg').textContent = '今日免费额度已用完，请在电脑端插件中激活专业版';
                        btn.style.display = 'inline-flex';
                    } else {
                        document.getElementById('errorModalMsg').textContent = `第 ${i + 1} 张图片上传失败: ${msg}`;
                        btn.style.display = 'none';
                    }
                    document.getElementById('errorModal').style.display = 'flex';
                    break; // 出错即刻跳出循环，不再重复提示和请求
                }
            }

            progressLabel.textContent = '传输完成！';
            setTimeout(() => {
                uploadZone.classList.remove('uploading');
                progressContainer.style.display = 'none';
                progressFill.style.width = '0%';
                uploadLabel.textContent = '点击选择或拍摄截图';
                fileInput.value = '';
            }, 2000);
        });

        // --- 5. 工具函数 ---
        function compressImage(file, quality = 0.85) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    fileToBase64(file).then(resolve).catch(reject);
                    return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let w = img.naturalWidth || img.width;
                            let h = img.naturalHeight || img.height;
                            
                            // 限制最大边长为 2048 像素 (移动端阅读与 Eagle 收集的黄金尺寸)
                            const maxBound = 2048;
                            if (w > maxBound || h > maxBound) {
                                if (w > h) {
                                    h = Math.round(h * maxBound / w);
                                    w = maxBound;
                                } else {
                                    w = Math.round(w * maxBound / h);
                                    h = maxBound;
                                }
                            }
                            
                            canvas.width = w;
                            canvas.height = h;
                            
                            const ctx = canvas.getContext('2d');
                            // 填充白色背景底色，防止带透明度的 PNG 截图或素材转 JPEG 时产生黑色难看背景
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fillRect(0, 0, w, h);
                            
                            ctx.drawImage(img, 0, 0, w, h);
                            
                            // 统一强行输出为 image/jpeg 以获得极其出色的压缩率 (特别针对 iOS/Android 巨大 PNG 截图)
                            const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(compressedDataUrl);
                        } catch (err) {
                            // 发生任何异常直接降级使用原始 Base64
                            resolve(e.target.result);
                        }
                    };
                    img.onerror = () => {
                        resolve(e.target.result);
                    };
                };
                reader.onerror = error => reject(error);
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function copyUploadUrl() {
            if (!config.sid) {
                showToast('⚠️ 请通过插件扫码进入');
                return;
            }
            const url = `${config.api}/api/upload?sid=${config.sid}&t=${config.t}`;
            navigator.clipboard.writeText(url).then(() => showToast('✅ 已复制快捷指令链接'));
        }
    </script>
</body>
</html>
